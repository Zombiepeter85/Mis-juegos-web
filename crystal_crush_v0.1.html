<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Crush</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #fff;
      font-family: 'Quicksand', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 2.8rem;
      background: linear-gradient(to right, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .score-board {
      font-size: 1.5rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 30px;
      border-radius: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #score { color: #38bdf8; }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 45px);
      grid-template-rows: repeat(8, 45px);
      gap: 4px;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
    }

    .gem {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
    }

    .gem:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .gem.selected {
      background: rgba(56, 189, 248, 0.3);
      border: 2px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      transform: scale(1.1);
    }
    
    .gem.matched {
      animation: pop 0.3s ease forwards;
    }

    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    .btn {
      margin-top: 25px;
      background: linear-gradient(45deg, #38bdf8, #818cf8);
      border: none;
      color: #fff;
      padding: 12px 30px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>

  <h1>Crystal Crush</h1>
  
  <div class="score-board">
    PUNTOS: <span id="score">0</span>
  </div>

  <div class="board" id="board"></div>

  <button class="btn" onclick="initGame()">NUEVO ESCENARIO</button>

  <script>
    const rows = 8;
    const cols = 8;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    
    // Los "cristales" del juego
    const gemTypes = ['💎', '🔮', '🧊', '🌟', '🧿', '💠'];
    
    let grid = [];
    let score = 0;
    let selectedGem = null;
    let isProcessing = false;

    // --- SISTEMA DE AUDIO CRYSTAL CLEAR ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'select') {
        // Sonido de toque cristalino agudo y muy corto
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, t);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.start(t);
        osc.stop(t + 0.1);
      } 
      else if (type === 'match') {
        // Acorde brillante al hacer línea (simulando copas de cristal)
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1046.50, t); // C6
        osc.frequency.setValueAtTime(1318.51, t + 0.05); // E6
        osc.frequency.setValueAtTime(1567.98, t + 0.1); // G6
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.15, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
      }
      else if (type === 'error') {
        // Sonido grave sutil de error
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.2);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.start(t);
        osc.stop(t + 0.2);
      }
    }

    // --- LÓGICA DEL JUEGO ---
    function initGame() {
      score = 0;
      scoreEl.innerText = score;
      selectedGem = null;
      isProcessing = false;
      boardEl.innerHTML = '';
      grid = [];

      // Llenar la cuadrícula
      for (let r = 0; r < rows; r++) {
        let row = [];
        for (let c = 0; c < cols; c++) {
          let randomGem = getRandomGem(r, c, row, grid);
          row.push({ type: randomGem, r: r, c: c, element: null });
        }
        grid.push(row);
      }

      renderBoard();
    }

    // Generar gema evitando que haya 3 seguidas al empezar
    function getRandomGem(r, c, currentRow, fullGrid) {
      let safeGems = [...gemTypes];
      
      // Comprobar horizontal izquierda
      if (c >= 2 && currentRow[c-1].type === currentRow[c-2].type) {
        safeGems = safeGems.filter(g => g !== currentRow[c-1].type);
      }
      // Comprobar vertical arriba
      if (r >= 2 && fullGrid[r-1][c].type === fullGrid[r-2][c].type) {
        safeGems = safeGems.filter(g => g !== fullGrid[r-1][c].type);
      }
      
      return safeGems[Math.floor(Math.random() * safeGems.length)];
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const gem = grid[r][c];
          const div = document.createElement('div');
          div.className = 'gem';
          div.innerText = gem.type || '';
          div.dataset.r = r;
          div.dataset.c = c;
          
          div.addEventListener('click', () => handleGemClick(r, c));
          gem.element = div;
          boardEl.appendChild(div);
        }
      }
    }

    function handleGemClick(r, c) {
      initAudio();
      if (isProcessing) return;

      const currentGem = grid[r][c];

      if (!selectedGem) {
        // Seleccionar primera gema
        selectedGem = currentGem;
        currentGem.element.classList.add('selected');
        playSound('select');
      } else {
        // Si pincha la misma, deseleccionar
        if (selectedGem.r === r && selectedGem.c === c) {
          selectedGem.element.classList.remove('selected');
          selectedGem = null;
          return;
        }

        // Comprobar si son adyacentes (arriba, abajo, izquierda, derecha)
        const isAdjacent = Math.abs(selectedGem.r - r) + Math.abs(selectedGem.c - c) === 1;

        if (isAdjacent) {
          swapGems(selectedGem, currentGem);
        } else {
          // Cambiar selección a la nueva si no es adyacente
          selectedGem.element.classList.remove('selected');
          selectedGem = currentGem;
          currentGem.element.classList.add('selected');
          playSound('select');
        }
      }
    }

    async function swapGems(gem1, gem2) {
      isProcessing = true;
      gem1.element.classList.remove('selected');
      
      // Intercambiar en memoria visual (sencillo sin animación compleja)
      let tempType = gem1.type;
      gem1.type = gem2.type;
      gem2.type = tempType;
      
      gem1.element.innerText = gem1.type;
      gem2.element.innerText = gem2.type;

      selectedGem = null;

      // Comprobar si el intercambio genera línea
      const matches = findMatches();
      
      if (matches.length > 0) {
        await processMatches(matches);
      } else {
        // Movimiento inválido, deshacer
        playSound('error');
        setTimeout(() => {
          tempType = gem1.type;
          gem1.type = gem2.type;
          gem2.type = tempType;
          gem1.element.innerText = gem1.type;
          gem2.element.innerText = gem2.type;
          isProcessing = false;
        }, 400); // Pequeña pausa para que se vea el intento fallido
      }
    }

    function findMatches() {
      let matchedSet = new Set();

      // Buscar horizontales
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols - 2; c++) {
          let type = grid[r][c].type;
          if (!type) continue;
          if (grid[r][c+1].type === type && grid[r][c+2].type === type) {
            matchedSet.add(`${r},${c}`);
            matchedSet.add(`${r},${c+1}`);
            matchedSet.add(`${r},${c+2}`);
          }
        }
      }

      // Buscar verticales
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows - 2; r++) {
          let type = grid[r][c].type;
          if (!type) continue;
          if (grid[r+1][c].type === type && grid[r+2][c].type === type) {
            matchedSet.add(`${r},${c}`);
            matchedSet.add(`${r+1},${c}`);
            matchedSet.add(`${r+2},${c}`);
          }
        }
      }

      return Array.from(matchedSet).map(str => {
        const parts = str.split(',');
        return { r: parseInt(parts[0]), c: parseInt(parts[1]) };
      });
    }

    async function processMatches(matches) {
      playSound('match');
      
      // Añadir puntos y animación
      score += matches.length * 10;
      scoreEl.innerText = score;

      matches.forEach(m => {
        grid[m.r][m.c].element.classList.add('matched');
      });

      // Esperar a que termine la animación de desaparecer
      await new Promise(r => setTimeout(r, 300));

      // Vaciar celdas
      matches.forEach(m => {
        grid[m.r][m.c].type = null;
        grid[m.r][m.c].element.innerText = '';
        grid[m.r][m.c].element.classList.remove('matched');
      });

      // Gravedad: hacer caer las gemas
      applyGravity();

      // Rellenar huecos vacíos arriba
      fillEmptySpaces();

      // Renderizar de nuevo tras la caída
      renderBoard();

      // Comprobar si hay combos en cadena (recursivo)
      setTimeout(async () => {
        const newMatches = findMatches();
        if (newMatches.length > 0) {
          await processMatches(newMatches);
        } else {
          isProcessing = false; // Fin del turno
        }
      }, 300);
    }

    function applyGravity() {
      for (let c = 0; c < cols; c++) {
        // Empezar desde abajo hacia arriba
        for (let r = rows - 1; r >= 0; r--) {
          if (grid[r][c].type === null) {
            // Buscar la primera gema por encima que no esté vacía
            for (let above = r - 1; above >= 0; above--) {
              if (grid[above][c].type !== null) {
                // Hacerla caer
                grid[r][c].type = grid[above][c].type;
                grid[above][c].type = null;
                break;
              }
            }
          }
        }
      }
    }

    function fillEmptySpaces() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].type === null) {
            grid[r][c].type = gemTypes[Math.floor(Math.random() * gemTypes.length)];
          }
        }
      }
    }

    // Iniciar al cargar
    initGame();
  </script>
</body>
</html>
